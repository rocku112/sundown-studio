name: 實驗功能檢查（ETF／波段）

# 非 main 分支改到 ETF 或波段策略相關檔案時，實際抓資料跑一次，不提交。
on:
  push:
    branches-ignore: [main]
    paths:
      - "twflow/scripts/fetch_etf.py"
      - "swing/**"
      - "twflow/web/index.html"
      - ".github/workflows/lab-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r twflow/requirements.txt

      - name: 探測 FinMind 股權分散歷史（不影響結果）
        continue-on-error: true
        run: |
          curl -sS -m 60 "https://api.finmindtrade.com/api/v4/data?dataset=TaiwanStockHoldingSharesPer&data_id=2330&start_date=2021-01-01&end_date=2021-02-28" | head -c 1500; echo
          curl -sS -m 60 "https://api.finmindtrade.com/api/v4/data?dataset=TaiwanStockHoldingSharesPer&data_id=2330&start_date=2026-08-01" | head -c 600; echo

      - name: 集保千張大戶
        run: python -X utf8 swing/scripts/fetch_tdcc.py

      - name: 基本面（估值＋季報）
        run: python -X utf8 swing/scripts/fetch_fund.py && ls -la swing/data/fund

      - name: 月營收（公開資訊觀測站）
        run: python -X utf8 swing/scripts/fetch_revenue.py

      - name: 籌碼（試抓最近 3 天）
        run: python -X utf8 swing/scripts/fetch_chips.py --days 3 && ls -la swing/data/chips && head -c 400 swing/data/chips/*.json

      - name: ETF 折溢價
        working-directory: twflow
        run: python -X utf8 scripts/fetch_etf.py

      - name: 波段：抓五年日線
        run: python -X utf8 swing/scripts/fetch_hist.py

      - name: 波段：回測
        run: python -X utf8 swing/scripts/backtest_swing.py

      - name: 持股健檢比較基準
        run: python -X utf8 swing/scripts/build_bench.py

      - name: 持有期勝率
        run: python -X utf8 swing/scripts/holding_odds.py

      - name: 短線證據檢驗
        run: python -X utf8 swing/scripts/evidence.py

      - uses: actions/upload-artifact@v4
        with:
          name: lab-output
          path: |
            twflow/web/data/etf.json
            twflow/web/data/swing.json
            twflow/web/data/evidence.json
            twflow/web/data/evidence_stocks.json

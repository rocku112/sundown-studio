name: 實驗功能檢查（ETF／波段）

# 非 main 分支改到 ETF 或波段策略相關檔案時，實際抓資料跑一次，不提交。
on:
  push:
    branches-ignore: [main]
    paths:
      - "twflow/scripts/fetch_etf.py"
      - "twflow/scripts/fetch_taifex.py"
      - "twflow/scripts/build_etf_profile.py"
      - "swing/**"
      - "twflow/web/index.html"
      - ".github/workflows/lab-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r twflow/requirements.txt

      - name: 官方日線（最近 3 天＋除權息日驗證）
        run: |
          python -u -X utf8 swing/scripts/fetch_prices.py --days 3
          cd swing/scripts && python -u -X utf8 -c "
          from datetime import date
          import fetch_prices as fp
          ref = fp.refs('2025-06')
          for d in (date(2025, 6, 12), date(2025, 6, 19)):
              a, _ = fp.twse(d); b, _ = fp.tpex(d)
              rows = fp.apply_refs({**a, **b}, ref.get(d.isoformat(), {}))
              ex = [(c, rows[c][5]) for c in ref.get(d.isoformat(), {}) if c in rows][:6]
              print(d, '除權息', len(ref.get(d.isoformat(), {})), '檔；例', ex, '；2330', rows.get('2330'), '0056', rows.get('0056'))
          "

      - name: 台股完整清單
        working-directory: twflow
        run: python -X utf8 scripts/build_directory.py

      - name: 集保千張大戶
        run: python -X utf8 swing/scripts/fetch_tdcc.py

      - name: 基本面（估值＋季報）
        run: timeout 20m python -u -X utf8 swing/scripts/fetch_fund.py; ls -la swing/data/fund || true

      - name: 月營收（公開資訊觀測站）
        run: python -X utf8 swing/scripts/fetch_revenue.py

      - name: 籌碼（試抓最近 3 天）
        run: python -X utf8 swing/scripts/fetch_chips.py --days 3 && ls -la swing/data/chips && head -c 400 swing/data/chips/*.json

      - name: ETF 折溢價
        working-directory: twflow
        run: python -X utf8 scripts/fetch_etf.py

      - name: ETF 體質表（配息、長期報酬、受益人數）
        working-directory: twflow
        run: python -u -X utf8 scripts/build_etf_profile.py

      - name: 波段：抓五年日線
        run: python -X utf8 swing/scripts/fetch_hist.py

      - name: 官方日線整理（資料不足一千天時沿用 Yahoo）
        run: python -X utf8 swing/scripts/build_ohlcv.py || echo "沿用 Yahoo"

      - name: 波段：回測
        run: python -X utf8 swing/scripts/backtest_swing.py

      - name: 持股健檢比較基準
        run: python -X utf8 swing/scripts/build_bench.py

      - name: 持有期勝率
        run: python -X utf8 swing/scripts/holding_odds.py

      - name: 定期定額 vs 位階加碼／調節
        run: python -X utf8 swing/scripts/rules_vs_dca.py

      - name: 短線證據檢驗
        run: python -X utf8 swing/scripts/evidence.py

      - name: 智慧選股資料表
        run: python -X utf8 swing/scripts/build_screen.py

      - name: 台指期（五年）
        working-directory: twflow
        run: timeout 50m python -u -X utf8 scripts/fetch_taifex.py --months 62 --budget 32 || true

      - uses: actions/upload-artifact@v4
        with:
          name: lab-output
          path: |
            twflow/web/data/etf.json
            twflow/web/data/swing.json
            twflow/web/data/evidence.json
            twflow/web/data/evidence_stocks.json
            twflow/web/data/screen.json
            twflow/web/data/taifex.json
            twflow/web/data/etf_profile.json
            twflow/web/data/rules_dca.json

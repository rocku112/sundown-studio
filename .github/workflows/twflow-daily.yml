name: twflow 每日盤後更新

# 台股 13:30 收盤，證交所/櫃買的三大法人日報約 17:00–18:00 陸續到齊。
# 18:40(TW) = 10:40 UTC 起跑，留足緩衝；若來源延遲，隔日的排程會自動補上
# （逐日檔是 append-only，缺哪天就補哪天，不會重抓已有的）。
on:
  schedule:
    - cron: "40 10 * * 1-5"
  workflow_dispatch:
    inputs:
      days:
        description: "至少保留幾個交易日"
        default: "60"

concurrency:
  group: twflow-daily
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r twflow/requirements.txt

      # 只抓缺的交易日；已落檔的日期完全不碰來源站
      - name: 抓當日盤後資料
        working-directory: twflow
        run: python -X utf8 scripts/fetch_market.py --days ${{ inputs.days || '60' }}

      # 板塊「定義」（剪枝與題材）不在這裡重算——那會讓成分股天天變動。
      # 定義由 twflow-weekly.yml 每週更新一次，這裡只重算數字。
      - name: 重算板塊指標
        working-directory: twflow
        run: |
          python -X utf8 scripts/build_sectors.py
          python -X utf8 scripts/build_web.py
          python -X utf8 scripts/build_events.py
          python -X utf8 scripts/build_chains.py
          # 完整搜尋清單（全部上市櫃證券，權證除外）
          python -X utf8 scripts/build_directory.py || echo "::warning::台股完整清單產生失敗"
          # 台美連動用到台股最新收盤（ADR 溢價、關聯股漲跌），台股更新後也要重算。
          # 這步失敗只影響台美頁，不能擋住台股盤後更新
          python -X utf8 ../usflow/scripts/build_cross.py || echo "::warning::台美連動重算失敗"
          # 訊號成效回測：結果直接給前端「訊號成效」卡片。失敗不擋盤後更新
          python -X utf8 scripts/backtest.py || echo "::warning::訊號回測失敗"
          # ETF 折溢價（證交所 17:00 後的收盤估值快照）
          python -X utf8 scripts/fetch_etf.py || echo "::warning::ETF 折溢價抓取失敗"
          # 月營收（只補新月份；失敗時沿用已存的月份）
          ( cd .. && python -X utf8 swing/scripts/fetch_revenue.py ) || echo "::warning::月營收抓取失敗"
          # 籌碼歷史（法人＋融資融券）：每天補最新幾天，並順便回補五年歷史 25 分鐘，補完後幾秒就結束
          ( cd .. && python -X utf8 swing/scripts/fetch_chips.py --days 2550 --budget 25 ) || echo "::warning::籌碼抓取失敗"
          # 集保千張大戶（每週一份，只能從現在開始累積）
          ( cd .. && python -X utf8 swing/scripts/fetch_tdcc.py ) || echo "::warning::集保資料抓取失敗"
          # ETF 體質表（配息、長期含息報酬、風險、受益人數）
          python -X utf8 scripts/build_etf_profile.py || echo "::warning::ETF 體質表產生失敗"
          # 台指期（日盤、法人未平倉、PCR；夜盤由 taifex-morning.yml 清晨補上）
          timeout 15m python -X utf8 scripts/fetch_taifex.py --budget 8 || echo "::warning::台指期抓取失敗"
          # 基本面（月底估值、季報；已有的不重抓）
          ( cd .. && timeout 20m python -X utf8 swing/scripts/fetch_fund.py --budget 16 ) || echo "::warning::基本面抓取失敗"
          # 新增官方來源：重大訊息、庫藏股、董監質押、處置／注意股、借券、景氣燈號（每日快照＋歷史回補）
          ( cd .. && timeout 14m python -u -X utf8 swing/scripts/fetch_extra.py --budget 12 ) || echo "::warning::新增資料來源抓取失敗"
          # 官方日線（含日後下市股票）：補最新幾天，並順便回補十年歷史 20 分鐘
          ( cd .. && python -X utf8 swing/scripts/fetch_prices.py --days 2550 --budget 20 ) || echo "::warning::官方日線抓取失敗"
          # 波段實驗室：五年日線回測（約 3 分鐘）
          # 官方日線滿一千天時取代 Yahoo（消除倖存者偏差），否則沿用 Yahoo
          ( cd .. && python -X utf8 swing/scripts/fetch_hist.py && { python -X utf8 swing/scripts/build_ohlcv.py || true; } \
              && python -X utf8 swing/scripts/backtest_swing.py \
              && python -X utf8 swing/scripts/build_bench.py && python -X utf8 swing/scripts/holding_odds.py \
              && { python -X utf8 swing/scripts/rules_vs_dca.py || true; } \
              && python -X utf8 swing/scripts/evidence.py \
              && { python -X utf8 swing/scripts/portfolio_lab.py || true; } \
              && { python -X utf8 swing/scripts/stress_lab.py || true; } \
              && { python -X utf8 swing/scripts/horizon_lab.py || true; } \
              && { python -X utf8 swing/scripts/literature_lab.py || true; } \
              && { python -X utf8 swing/scripts/extra_lab.py || true; } ) \
            || echo "::warning::波段回測失敗"
          # 智慧選股資料表（技術、籌碼、基本面、大戶）
          ( cd .. && python -X utf8 swing/scripts/build_screen.py ) || echo "::warning::智慧選股資料表產生失敗"
          # 每檔股票最新消息（需要 build_web 產生的 latest.json）
          timeout 12m python -u -X utf8 scripts/fetch_news.py --top 300 --budget 8 || echo "::warning::新聞抓取失敗"
          # 每檔股票的風險與籌碼旗標（質押、處置／注意、借券、庫藏股）
          python -X utf8 scripts/build_flags.py || echo "::warning::旗標產生失敗"
          python -X utf8 scripts/snapshot.py

      - name: 檢查資料是否合理
        working-directory: twflow
        run: python -X utf8 scripts/sanity_check.py

      - name: 提交
        run: |
          git config user.name  "twflow-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add twflow/data/market/days twflow/data/market/stock_meta.json $(ls -d twflow/data/etf twflow/data/taifex 2>/dev/null) \
                  $(ls swing/data/revenue.json 2>/dev/null) $(ls -d swing/data/chips swing/data/fund swing/data/tdcc swing/data/prices swing/data/forward swing/data/extra 2>/dev/null) \
                  twflow/data/market/market.json twflow/web/data \
                  twflow/web/snapshot.html
          if git diff --staged --quiet; then
            echo "沒有變動（非交易日或來源尚未更新）"
          else
            git commit -m "data: $(date -u -d '+8 hours' +%Y-%m-%d) 盤後更新"
            # 執行期間 main 可能有新提交（合併 PR、台指期清晨更新）：rebase 後重推；同檔衝突以本次新資料為準
            for i in 1 2 3; do
              git push && exit 0
              git pull --rebase -X theirs origin main || { git rebase --abort; exit 1; }
              sleep $((i * 10))
            done
            exit 1
          fi

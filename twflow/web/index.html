const benchReady=()=>BENCH?Promise.resolve(BENCH)
  :fetch('data/bench.json').then(r=>r.json()).then(j=>(BENCH=j)).catch(()=>null);
// 賣出成本：台股手續費 0.1425%＋證交稅（股票 0.3%、ETF 0.1%）；複委託手續費各家不同，以 0.25% 估
const SELLCOST={tw:0.001425+0.003, etf:0.001425+0.001, us:0.0025};
const fxNow=()=>(CROSS&&CROSS.fx)||(USD&&USD.stock_data['TWD=X']?.price)||null;
const ntd=v=>v==null?'—':(v<0?'-':'')+'NT$'+Math.round(Math.abs(v)).toLocaleString();

function resolveCode(raw){
  const q=String(raw||'').trim().toUpperCase().replace(/^(US:|ETF:)/,'');
  if(!q) return null;
  if(D&&D.stock_data[q]) return {key:q,mkt:'tw'};
  if(ETFD&&ETFD.etfs.some(e=>e.code===q)) return {key:'ETF:'+q,mkt:'etf'};
  if(USD&&USD.stock_data[q]&&USD.stock_data[q].type!=='index') return {key:'US:'+q,mkt:'us'};
  if(DIR.tw&&DIR.tw[q]) return {key:'TWX:'+q,mkt:'tw'};
  const u=q.replace('.','-'); if(DIR.us&&DIR.us[u]) return {key:'USX:'+u,mkt:'us'};
  return null;
}
function holdInfo(h){
  const fx=fxNow();
  if(h.key.startsWith('US:')){ const d=USD&&USD.stock_data[h.key.slice(3)];
    return d&&{name:d.name,code:h.key.slice(3),mkt:'us',price:d.price,cur:'USD',fx,
      group:'美股・'+(d.sector||'其他'),chg:d.chg_1d,yieldNet:d.yield_net}; }
  if(h.key.startsWith('ETF:')){ const e=ETFD&&ETFD.etfs.find(x=>x.code===h.key.slice(4));
    return e&&{name:e.name,code:e.code,mkt:'etf',price:e.price,cur:'TWD',fx:1,
      group:'ETF・'+e.cat,prem:e.prem,cat:e.cat}; }
  if(h.key.startsWith('TWX:')){ const r=DIR.tw&&DIR.tw[h.key.slice(4)];
    return r&&{name:r[1],code:r[0],mkt:r[2]==='e'?'etf':'tw',price:r[4],cur:'TWD',fx:1,chg:r[5],group:'台股・'+(TWK[r[2]]||'其他')}; }
  if(h.key.startsWith('USX:')){ const r=DIR.us&&DIR.us[h.key.slice(4)];
    return r&&{name:r[1],code:r[0],mkt:'us',price:r[3],cur:'USD',fx,chg:r[4],group:'美股・'+(r[2]==='e'?'ETF':(r[6]||'其他'))}; }
  const d=D&&D.stock_data[h.key];
  return d&&{name:d.name,code:h.key,mkt:'tw',price:d.price,cur:'TWD',fx:1,chg:d.chg_1d,
    group:'台股・'+String((D.stock_sectors[h.key]||['未分類'])[0]).replace(/^[^・]+・/,'')};
}
function benchRet(date){
  const b=BENCH&&BENCH['0050']; if(!b||!date) return null;
  const i=b.d.findIndex(x=>x>=date); if(i<0) return null;
  return b.c[b.c.length-1]/b.c[i]-1;
}

function buildHold(){
  const el=$('hold');
  // 解析代號需要 ETF 與美股資料，第一次進來先載入
  if(!ETFD||!BENCH){ Promise.all([etfReady(),benchReady()]).then(()=>{ if(curView==='hold') buildHold(); }); }
  if(!DIR.tw&&!DIR.us&&HOLD.some(h=>/^(TWX|USX):/.test(h.key))) dirReady().then(()=>{ if(curView==='hold') buildHold(); });
  const rows=HOLD.map(h=>{const i=holdInfo(h); if(!i||!i.price||!i.fx) return {h,i:null};
    const val=i.price*h.shares*i.fx, cost=h.cost*h.shares*i.fx;
    const net=val*(1-SELLCOST[i.mkt]);
    const br=benchRet(h.date);
    return {h,i,val,cost,pnl:val-cost,netPnl:net-cost,ret:(val/cost-1)*100,
      bench:br==null?null:cost*(1+br), benchRet:br==null?null:br*100};});
  const ok=rows.filter(r=>r.i);
  const tv=ok.reduce((a,r)=>a+r.val,0), tc=ok.reduce((a,r)=>a+r.cost,0);
  const tn=ok.reduce((a,r)=>a+r.netPnl,0);
  ok.forEach(r=>r.w=tv?r.val/tv:0);
  const ws=ok.map(r=>r.w).sort((a,b)=>b-a);
  const effN=ws.length?1/ws.reduce((a,w)=>a+w*w,0):0;
  const grp={}; ok.forEach(r=>grp[r.i.group]=(grp[r.i.group]||0)+r.w);
  const mk={台股:0,ETF:0,美股:0}; ok.forEach(r=>mk[{tw:'台股',etf:'ETF',us:'美股'}[r.i.mkt]]+=r.w);
  const withB=ok.filter(r=>r.bench!=null), bv=withB.reduce((a,r)=>a+r.bench,0), av=withB.reduce((a,r)=>a+r.val,0);
  // 風險提醒：只陳述事實與常識，不給買賣指示
  const warn=[];
  ok.forEach(r=>{
    if(r.w>.3) warn.push(`${r.i.name} 占總資產 ${(r.w*100).toFixed(0)}%，單一持股過重，這檔大跌時整體會跟著重傷。`);
    if(r.i.cat==='槓桿'||r.i.cat==='反向') warn.push(`${r.i.name} 是${r.i.cat}型 ETF，每日重設倍數，長期持有會因波動耗損，報酬可能和指數差很多。`);
    if(r.i.prem!=null&&r.i.prem>1) warn.push(`${r.i.name} 目前溢價 ${r.i.prem.toFixed(2)}%，市價比淨值貴，加碼等於多付錢。`);
  });
  if(ok.length>=2&&effN<3) warn.push(`有效持股數只有 ${effN.toFixed(1)} 檔，分散程度低。`);
  const unk=rows.filter(r=>!r.i);

  el.innerHTML=`
    <div class="card"><h3>持股健檢</h3>
      <p class="note" style="font-size:12.5px;margin-bottom:12px">資料只存在這台裝置的瀏覽器，不會上傳。成本請填「含手續費的平均成本」（每股，原幣別）。</p>
      <div class="hform">
        <input id="h-code" placeholder="代號 例 2330、0050、AAPL" autocomplete="off">
        <input id="h-sh" type="number" min="0" step="any" placeholder="股數">
        <input id="h-cost" type="number" min="0" step="any" placeholder="平均成本">
        <input id="h-date" type="date" title="買進日期（選填，用來跟 0050 比較）">
        <button class="btn pri" id="h-add">加入</button></div>
      <div class="rsub" id="h-msg" style="margin-top:6px"></div></div>
    ${ok.length?`
    <div class="card"><h3>總覽・${ok.length} 檔</h3>
      <div class="ov5">
        <div><div class="l">目前市值</div><div class="n">${ntd(tv)}</div><div class="s">美股以匯率 ${fxNow()?.toFixed(2)??'—'} 換算</div></div>
        <div><div class="l">投入成本</div><div class="n">${ntd(tc)}</div></div>
        <div><div class="l">未實現損益</div><div class="n" style="color:${col(tv-tc)}">${ntd(tv-tc)}</div><div class="s">${pct(tc?(tv/tc-1)*100:null)}</div></div>
        <div><div class="l">現在全賣實拿損益</div><div class="n" style="color:${col(tn)}">${ntd(tn)}</div><div class="s">已扣手續費與證交稅</div></div>
        <div><div class="l">有效持股數</div><div class="n">${effN.toFixed(1)}</div><div class="s">最大一檔 ${(ws[0]*100).toFixed(0)}%</div></div>
        <div><div class="l">大盤跌 20% 時</div><div class="n" style="color:var(--down)">${ntd(-tv*.2)}</div><div class="s">粗估，假設與大盤同步</div></div>
      </div>
      ${withB.length?`<div class="rsub" style="margin-top:14px">同樣的錢當初都買 0050（${withB.length} 檔有填買進日期）</div>
        <div class="ov5" style="margin-top:6px">
          <div><div class="l">如果都買 0050</div><div class="n">${ntd(bv)}</div></div>
          <div><div class="l">你的實際市值</div><div class="n">${ntd(av)}</div></div>
          <div><div class="l">你${av>=bv?'贏':'輸'} 0050</div><div class="n" style="color:${col(av-bv)}">${ntd(Math.abs(av-bv))}</div></div></div>
        <div class="note">0050 以收盤價計、未含配息，實際 0050 報酬會再高一些；美股成本以今日匯率換算，比較為近似值。</div>`:''}
    </div>
    ${warn.length?`<div class="card" style="border-color:color-mix(in srgb,var(--gold) 45%,var(--line))"><h3>需要注意</h3>
      ${warn.map(w=>`<div class="krow"><span>⚠ ${esc(w)}</span></div>`).join('')}</div>`:''}
    <div class="card"><h3>配置</h3>
      ${Object.entries(mk).filter(([,w])=>w>0).map(([k,w])=>bar(k,w)).join('')}
      <div class="rsub" style="margin:12px 0 6px">產業／類別</div>
      ${Object.entries(grp).sort((a,b)=>b[1]-a[1]).map(([k,w])=>bar(k,w)).join('')}</div>`:''}
    ${rows.length?`<div class="card"><h3>持股明細</h3>${rows.map(r=>r.i?`
      <div class="ritem" data-code="${r.h.key}" style="grid-template-columns:minmax(0,1fr) auto auto">
        <div><div class="rname">${esc(r.i.name)} <span style="color:var(--s8);font-weight:400">${esc(r.i.code)}</span></div>
          <div class="rsub" style="white-space:normal">${r.h.shares.toLocaleString()} 股　成本 ${r.h.cost}　現價 ${r.i.price}${r.i.cur==='USD'?' 美元':''}　占 ${(r.w*100).toFixed(1)}%
            ${r.benchRet!=null?`　同期 0050 ${pct(r.benchRet)}`:''}</div></div>
        <div class="rval">${pill(r.ret)}<small style="color:${col(r.pnl)}">${ntd(r.pnl)}</small></div>
        <button class="icon" data-del="${r.h.id}" title="刪除">✕</button></div>`
      :`<div class="ritem" style="grid-template-columns:minmax(0,1fr) auto"><div><div class="rname">${esc(r.h.key)}</div>
        <div class="rsub">找不到這檔的最新價格（可能資料還在載入，或不在本站涵蓋範圍）</div></div>
        <button class="icon" data-del="${r.h.id}">✕</button></div>`).join('')}
      <div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap">
        <button class="btn" id="h-exp">匯出備份</button>
        <label class="btn" style="cursor:pointer">匯入備份<input id="h-imp" type="file" accept="application/json" hidden></label>
        <button class="btn" id="h-clear">全部清除</button></div></div>`
    :`<div class="empty">還沒有持股。輸入代號、股數與平均成本後按「加入」。<br>台股、ETF、美股都可以，美股會自動用匯率換算成台幣。</div>`}
    <div class="card note">損益與實拿金額為依最新收盤價的估算；賣出成本以台股手續費 0.1425% ＋ 證交稅（股票 0.3%、ETF 0.1%）、複委託 0.25% 估算，實際依券商費率。
      本頁只計算你自己輸入的資料，不構成投資建議。</div>`;
  function bar(k,w){ return `<div class="hbar"><span>${esc(k)}</span><div><i style="width:${(w*100).toFixed(1)}%"></i></div><b>${(w*100).toFixed(1)}%</b></div>`; }

  const msg=t=>{ $('h-msg').textContent=t; };
  if($('h-code')) $('h-code').onfocus=()=>dirReady();
  $('h-add').onclick=()=>{
    const r=resolveCode($('h-code').value), sh=+$('h-sh').value, cost=+$('h-cost').value, date=$('h-date').value||null;
    if(!r) return msg('找不到這個代號。台股、台股 ETF、美股（S&P 500、那斯達克 100 與常見 ETF）都可以。');
    if(!(sh>0)||!(cost>0)) return msg('請填股數與平均成本（都要大於 0）。');
    HOLD.push({id:Date.now().toString(36),key:r.key,shares:sh,cost,date}); saveHold(); buildHold();
  };
  el.onclick=e=>{
    const d=e.target.closest('[data-del]');
    if(d){ HOLD=HOLD.filter(h=>h.id!==d.dataset.del); saveHold(); buildHold(); return; }
    const c=e.target.closest('.ritem[data-code]'); if(c&&!e.target.closest('button')) openStock(c.dataset.code);
  };
  const exp=$('h-exp'); if(exp) exp.onclick=()=>{
    const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([JSON.stringify(HOLD,null,1)],{type:'application/json'}));
    a.download='twflow-持股備份.json'; a.click(); };
  const imp=$('h-imp'); if(imp) imp.onchange=async()=>{
    try{ const j=JSON.parse(await imp.files[0].text());
      if(!Array.isArray(j)||!j.every(h=>h&&h.key&&h.shares>0&&h.cost>0)) throw 0;
      HOLD=j; saveHold(); buildHold(); toast('已匯入 '+j.length+' 筆持股');
    }catch(_){ toast('檔案格式不對，請用本站匯出的備份檔'); } };
  const clr=$('h-clear'); if(clr) clr.onclick=()=>{ if(confirm('確定清除全部持股？')){ HOLD=[]; saveHold(); buildHold(); } };
}

/* ══ 市場切換 ══════════════════════════════════════════════════
   沒手動選過時依台灣時間：清晨到開盤前（05:00–09:00）美股剛收盤，預設美股；
   其餘時段預設台股。手動切換只記在這個分頁（sessionStorage）——
   記成永久的話，早上切過一次美股，晚上打開就看不到台股盤後了。 */
function defaultMarket(){
  try{ const m=sessionStorage.getItem('twflow_market'); if(m) return m; }catch(_){}
  const h=new Date(Date.now()+8*3600e3).getUTCHours();
  return h>=5&&h<9?'us':'tw';
}
let MARKET=defaultMarket();
function setMarket(m){
  MARKET=m;
  try{ sessionStorage.setItem('twflow_market',m); }catch(_){}
  document.querySelectorAll('#mkt button').forEach(b=>b.classList.toggle('on',b.dataset.m===m));
  const t=TABS[m];
  $('tabs').innerHTML=t.map(([v,,l])=>`<button data-v="${v}">${l}</button>`).join('');
  // 手機底部最多放 5 格：超過時放前 4 個＋「更多」
  const main=t.length>5?t.slice(0,4):t, rest=t.length>5?t.slice(4):[];
  $('nav').innerHTML=main.map(([v,e,l])=>`<button data-v="${v}"><em>${e}</em>${l}</button>`).join('')+
    (rest.length?`<button data-more><em>⋯</em>更多</button>`:'');
  $('more').innerHTML=rest.map(([v,e,l])=>`<button data-v="${v}"><em>${e}</em>${l}</button>`).join('');
  document.querySelectorAll('#tabs button,#nav button[data-v],#more button').forEach(b=>
    b.onclick=()=>setView(b.dataset.v));
  const mb=$('nav').querySelector('[data-more]'); if(mb) mb.onclick=e=>{e.stopPropagation();$('more').classList.toggle('on');};
  // 共用的頁面切市場時留在原頁，其他頁回到該市場第一頁
  setView(t.some(x=>x[0]===curView)?curView:t[0][0]);
  updateMeta(); updateBadge(); buildRail();
}

let selIdx=-1;
// 完整清單（全部台股掛牌證券、全部美股與美國 ETF）：第一次點搜尋框才載入
let DIR={tw:null,us:null}, dirLoading=null;
const dirReady=()=>dirLoading||(dirLoading=Promise.all([
  fetch('data/tw_all.json').then(r=>r.json()).catch(()=>null),
  fetch('data/us/all.json').then(r=>r.json()).catch(()=>null)]).then(([t,u])=>{
    DIR.tw=t&&Object.fromEntries(t.rows.map(r=>[r[0],r])); DIR.twDate=t&&t.date;
    DIR.us=u&&Object.fromEntries(u.rows.map(r=>[r[0],r])); DIR.usDate=u&&u.date; return DIR;}));
const TWK={s:'台',e:'ETF',n:'ETN',d:'TDR',p:'特別股',b:'REITs'};
$('q').onfocus=()=>{
  const re=()=>{ if($('q').value.trim()) $('q').oninput(); };
  if(!ETFD) etfReady().then(re);
  if(!DIR.tw&&!DIR.us) dirReady().then(re);
};
$('q').oninput=()=>{
  const q=$('q').value.trim().toLowerCase(); const box=$('qr');
  if(!q||!SEARCH){box.classList.remove('on');return;}
  const m=(c,n)=>c.toLowerCase().startsWith(q)||String(n||'').toLowerCase().includes(q);
  const exact=(a,b)=>(b[1].toLowerCase()===q)-(a[1].toLowerCase()===q);
  // 每項：[開啟用的 key, 代號, 名稱, 標籤]
  const tw=Object.entries(SEARCH).filter(([c,n])=>m(c,n)).map(([c,n])=>[c,c,n,'台']);
  const etf=ETFD?ETFD.etfs.filter(e=>m(e.code,e.name)).map(e=>['ETF:'+e.code,e.code,e.name,'ETF']):[];
  const twSeen=new Set([...Object.keys(SEARCH),...(ETFD?ETFD.etfs.map(e=>e.code):[])]);
  const twx=DIR.tw?Object.values(DIR.tw).filter(r=>!twSeen.has(r[0])&&m(r[0],r[1]))
    .map(r=>['TWX:'+r[0],r[0],r[1],TWK[r[2]]||'台']):[];
  const us=USD?Object.entries(USD.stock_data)
    .filter(([c,d])=>d.type!=='index'&&m(c,d.name)).map(([c,d])=>['US:'+c,c,d.name,'美']):[];
  const usx=DIR.us?Object.values(DIR.us).filter(r=>!(USD&&USD.stock_data[r[0]])&&m(r[0],r[1]))
    .map(r=>['USX:'+r[0],r[0],r[1],r[2]==='e'?'美ETF':'美']):[];
  const twAll=[...tw,...etf,...twx].sort(exact), usAll=[...us,...usx].sort(exact);
  // 00 開頭先列台股 ETF；純數字台股優先；含英文字母或在美股頁時美股優先
  const hits=(/^\d/.test(q)?[...twAll,...usAll]:MARKET==='us'||/[a-z]/.test(q)?[...usAll,...twAll]:[...twAll,...usAll])
    .sort(exact).slice(0,30);
  selIdx=-1;
  box.innerHTML=hits.length?hits.map(([k,c,n,mk])=>
    `<div data-code="${k}"><i><em class="mk">${mk}</em>${esc(c)}</i><span>${esc(n)}</span></div>`).join('')
    :`<div style="color:var(--s8);line-height:1.7;white-space:normal">查無此代號<br><small>收錄範圍：台股全部上市櫃證券（權證除外）、美股全部掛牌股票與 ETF。${DIR.tw||DIR.us?'':'（完整清單載入中，稍後再試）'}</small></div>`;
  box.classList.toggle('on',true);
};
$('qr').onclick=e=>{const d=e.target.closest('[data-code]');
  if(d){openStock(d.dataset.code);$('qr').classList.remove('on');$('q').value='';}};
$('q').onkeydown=e=>{
  const items=[...$('qr').querySelectorAll('[data-code]')];
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){
    e.preventDefault(); selIdx+=e.key==='ArrowDown'?1:-1;
    selIdx=Math.max(0,Math.min(items.length-1,selIdx));
    items.forEach((x,i)=>x.classList.toggle('sel',i===selIdx));
    items[selIdx]?.scrollIntoView({block:'nearest'});
  } else if(e.key==='Enter'&&items.length){
    openStock(items[Math.max(0,selIdx)].dataset.code);
    $('qr').classList.remove('on'); $('q').value=''; $('q').blur();
  }
};
document.addEventListener('click',e=>{
  if(!e.target.closest('.search')) $('qr').classList.remove('on');
  if(!e.target.closest('#more')) $('more').classList.remove('on');
});

/* ══ 設定 ══════════════════════════════════════════════════════
   漲跌顏色、字體大小、主題。存 localStorage；舊版只存主題（twflow_theme），讀得到就沿用。 */
const SKEY='twflow_settings';
const SET_OPTS={
  color:{l:'漲跌顏色',o:[['tw','紅漲綠跌（台灣）'],['us','綠漲紅跌（美國）']]},
  size:{l:'字體大小',o:[['s','小'],['m','中'],['l','大']]},
  theme:{l:'畫面主題',o:[['dark','暗色'],['light','亮色'],['auto','跟隨系統']]},
};
let SET={color:'tw',size:'m',theme:'dark'};
try{ const o=JSON.parse(localStorage.getItem(SKEY)||'null');
  if(o) SET={...SET,...o}; else{ const t=localStorage.getItem('twflow_theme'); if(t) SET.theme=t; } }catch(_){}
const sysDark=matchMedia('(prefers-color-scheme: dark)');
function applySettings(){
  const r=document.documentElement;
  r.dataset.theme=SET.theme==='auto'?(sysDark.matches?'dark':'light'):SET.theme;
  r.dataset.color=SET.color; r.dataset.size=SET.size;
  try{localStorage.setItem(SKEY,JSON.stringify(SET))}catch(_){}
  // 顏色寫在 SVG 屬性裡的（泡泡、走勢）要重畫才會換色
  if(D){ buildStats(); if($('v-chart').classList.contains('on')) render(); setView(curView); }
}
sysDark.addEventListener?.('change',()=>{ if(SET.theme==='auto') applySettings(); });
function buildSettings(){
  $('set-body').innerHTML=Object.entries(SET_OPTS).map(([k,v])=>`
    <div class="stitle">${v.l}</div>
    <div class="setrow">${v.o.map(([val,lab])=>`<button data-k="${k}" data-v="${val}"
      class="${SET[k]===val?'on':''}">${lab}</button>`).join('')}</div>`).join('')+`
    <div class="stitle">資料來源與免責</div>
    <div class="note" style="padding:0 16px 20px">台股：臺灣證券交易所、證券櫃檯買賣中心公開資料。美股：Yahoo Finance／Stooq 日線、美國 SEC EDGAR 申報。
      本服務僅就公開資訊進行彙整與統計呈現，非證券投資顧問事業，不構成任何投資建議；投資人應自行判斷並自負盈虧。</div>`;
}
$('set-body').onclick=e=>{const b=e.target.closest('[data-k]'); if(!b) return;
  SET[b.dataset.k]=b.dataset.v; applySettings(); buildSettings();};
$('settings').onclick=()=>{buildSettings(); show('set-panel');};
$('helpbtn').onclick=()=>{ setView('help'); scrollTo(0,0); };
applySettings();

/* ══ 重畫觸發 ══════════════════════════════════════════════════
   泡泡座標是依畫布尺寸算死的，尺寸變了不重畫，泡泡就會留在舊版面的位置——
   實測從手機切回桌機時，版面高度還停在 707（實際 453），25 顆泡泡跑到畫布外，
   而且不會有任何錯誤。

   ⚠️ 不能只靠 ResizeObserver：在部分內嵌瀏覽器環境它完全不觸發（連 observe
   當下的初次回呼都沒有，實測過）。所以以 window resize 為主、RO 為輔，
   並且在真正要畫之前比對「上次畫用的尺寸」，不同才重畫。 */
let rt=null, lastSize='';
function requestRender(force){
  if(!D) return;
  clearTimeout(rt);
  rt=setTimeout(()=>{
    if(!$('v-chart').classList.contains('on')) return;
    const r=$('chart').getBoundingClientRect();
    const key=Math.round(r.width)+'x'+Math.round(r.height);
    if(!force && key===lastSize) return;
    lastSize=key; render();
  },80);
}
/* ══ PWA ══════════════════════════════════════════════════════
   單檔 snapshot 用 file:// 開時沒有 SW，也不該註冊——包在 try 裡靜默略過。 */
if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
let deferredPrompt=null;
addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;
  const b=$('install'); if(b) b.style.display='grid';});
$('install').onclick=async()=>{
  if(!deferredPrompt) return;
  deferredPrompt.prompt(); await deferredPrompt.userChoice;
  deferredPrompt=null; $('install').style.display='none';
};

addEventListener('resize',()=>requestRender());
addEventListener('orientationchange',()=>requestRender());
try{ new ResizeObserver(()=>requestRender()).observe($('main')); }catch(_){}
// 最後一道保險：使用者把指標移進圖表時對一次尺寸。上面三個事件在少數環境
// （實測某些內嵌瀏覽器）都不會派送，這條至少保證「要動它之前」是對的。
// requestRender 內部會比對尺寸，沒變就不重畫，所以不會有額外成本。
$('chart').addEventListener('pointerenter',()=>requestRender());
</script>
</body>

<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>退休試算 · 早謀遠算 | SunDown Studio</title>
<meta name="description" content="整合勞保年金、勞退新制、勞基法舊制與投資複利的台灣退休試算。免費、免帳號，所有計算都在你的瀏覽器裡進行。">
<meta name="theme-color" content="#2D4A6E">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<header class="top">
  <div class="top-row">
    <a class="brand" href="./" title="回早謀遠算首頁">
      <svg viewBox="0 0 28 28" aria-hidden="true"><circle cx="14" cy="14" r="13" fill="#2D4A6E"/><path d="M2 14A12 12 0 0 1 26 14" fill="#E8B84B"/><g stroke="#fff" stroke-width="1.4"><line x1="4" y1="16" x2="24" y2="16" opacity=".85"/><line x1="5" y1="18.5" x2="23" y2="18.5" opacity=".7"/><line x1="7" y1="21" x2="21" y2="21" opacity=".55"/><line x1="9.5" y1="23.5" x2="18.5" y2="23.5" opacity=".4"/></g></svg>
      <div><b>SunDown <span>Studio</span></b><small>早謀遠算</small></div>
    </a>
    <nav class="tabs" id="tabs" role="tablist" aria-label="試算步驟"></nav>
    <div class="top-total"><small>退休月領</small><strong class="num" id="ttotal"></strong></div>
  </div>
</header>

<div class="mobile-sum" aria-live="polite">
  <div class="in">
    <div><small>退休月領總額</small><strong id="mtotal"></strong><div class="pv" id="mpv"></div></div>
    <div class="r"><div>保底 <b id="mfloor"></b></div><div>投資 <b id="minvest"></b></div></div>
  </div>
</div>

<div class="layout">
  <main id="main"></main>
  <aside id="aside" aria-label="試算摘要"></aside>
</div>

<dialog id="share" aria-labelledby="share-title">
  <div class="dlg">
    <h2 id="share-title">結果圖卡</h2>
    <p>下載後可分享給家人討論。圖卡只含總額，不含你的薪資與資產明細。</p>
    <div id="card-slot"></div>
    <div class="btn-row">
      <button type="button" class="btn" data-act="close-dialog">關閉</button>
      <button type="button" class="btn primary" style="flex:1;justify-content:center" data-act="download-card">下載 PNG</button>
    </div>
  </div>
</dialog>
<div class="toast" id="toast" role="status"></div>

<noscript><p style="padding:24px;text-align:center">早謀遠算需要啟用 JavaScript 才能試算。</p></noscript>
<script type="module" src="js/app.js"></script>
</body>
</html>

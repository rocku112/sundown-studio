<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>退休試算 · 早謀遠算 | SunDown Studio</title>
<meta name="description" content="整合勞保年金、勞退新制、勞基法舊制與投資複利的台灣退休試算。免費、免帳號，所有計算都在你的瀏覽器裡進行。">
<meta name="theme-color" content="#1E3554">
<meta property="og:type" content="website">
<meta property="og:title" content="早謀遠算 · 台灣退休規劃試算">
<meta property="og:description" content="勞保、勞退、投資一次算清楚。免費、免帳號，資料只存在你的瀏覽器。">
<meta property="og:url" content="https://rocku112.github.io/sundown-studio/tools/zaomou/app.html">
<meta property="og:image" content="https://rocku112.github.io/sundown-studio/tools/zaomou/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
<script>/* 先套用使用者指定的主題，避免載入時閃一下 */try{var t=JSON.parse(localStorage.getItem('zaomou_ui')||'{}').theme;if(t==='dark'||t==='light')document.documentElement.dataset.theme=t;}catch(e){}</script>
</head>
<body>
<header class="top">
  <div class="top-row">
    <a class="brand" href="./" title="回早謀遠算首頁">
      <svg viewBox="0 0 28 28" aria-hidden="true"><circle cx="14" cy="14" r="13" fill="#1E3554"/><path d="M2 14A12 12 0 0 1 26 14" fill="#E8B84B"/><g stroke="#fff" stroke-width="1.4"><line x1="4" y1="16" x2="24" y2="16" opacity=".85"/><line x1="5" y1="18.5" x2="23" y2="18.5" opacity=".7"/><line x1="7" y1="21" x2="21" y2="21" opacity=".55"/><line x1="9.5" y1="23.5" x2="18.5" y2="23.5" opacity=".4"/></g></svg>
      <div><b>早謀遠算</b><small>SunDown Studio</small></div>
    </a>
    <nav class="tabs" id="tabs" role="tablist" aria-label="試算步驟"></nav>
    <div class="hist" role="group" aria-label="復原與重做">
      <button type="button" id="btn-undo" title="復原（Ctrl+Z）" aria-label="復原" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button>
      <button type="button" id="btn-redo" title="重做（Ctrl+Shift+Z）" aria-label="重做" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 14l5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg></button>
      <button type="button" id="btn-theme" title="切換主題" aria-label="切換主題：自動"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 0 0 18z" fill="currentColor"/></svg></button>
    </div>
    <div class="top-total"><small>每月可用・今日幣值</small><strong class="num" id="ttotal"></strong></div>
  </div>
</header>

<div class="mobile-sum" aria-live="polite">
  <div class="in">
    <div><small>退休後每月可用・今日購買力</small><strong id="mtotal"></strong><div class="pv" id="mpv"></div></div>
    <div class="r"><div>保底 <b id="mfloor"></b></div><div>投資 <b id="minvest"></b></div></div>
  </div>
</div>

<div class="layout">
  <main id="main" role="tabpanel" tabindex="-1"></main>
  <aside id="aside" aria-label="試算摘要"></aside>
</div>

<dialog id="share" aria-labelledby="share-title">
  <div class="dlg">
    <h2 id="share-title">結果圖卡</h2>
    <p>下載後可分享給家人討論。圖卡只含總額，不含你的薪資與資產明細。</p>
    <div id="card-slot"></div>
    <div class="btn-row">
      <button type="button" class="btn" data-act="close-dialog">關閉</button>
      <button type="button" class="btn primary" style="flex:1;justify-content:center" data-act="download-card">下載 PNG</button>
    </div>
  </div>
</dialog>
<div class="toast" id="toast" role="status"></div>

<noscript><p style="padding:24px;text-align:center">早謀遠算需要啟用 JavaScript 才能試算。</p></noscript>
<script type="module" src="js/app.js"></script>
</body>
</html>
